<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none" className="w-auto h-10">
  <defs>
    <!-- Primary Blue Cyan Gradient -->
    <linearGradient id="wcpGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b581" />
    </linearGradient>

    <!-- Shield Fill Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Line Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- LOGO ICON MARK (Shield + Server Stack + Speed Pulse + W Monogram) -->
  <g transform="translate(10, 10)">
    <!-- Outer Protective Shield -->
    <path d="M 50 4 L 88 18 C 88 56 70 82 50 96 C 30 82 12 56 12 18 Z" 
          fill="url(#shieldBg)" 
          stroke="url(#wcpGlow)" 
          stroke-width="3.5" 
          stroke-linejoin="round" />

    <!-- Inner Cyber Grid Accent -->
    <path d="M 50 12 L 80 23 C 80 52 65 74 50 86 C 35 74 20 52 20 23 Z" 
          fill="none" 
          stroke="#1e293b" 
          stroke-width="1.5" 
          stroke-dasharray="3 3" />

    <!-- Server Blade 1 (Top) -->
    <rect x="28" y="28" width="44" height="10" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="34" cy="33" r="1.5" fill="#10b581" />
    <circle cx="40" cy="33" r="1.5" fill="#38bdf8" />
    <line x1="48" y1="33" x2="64" y2="33" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />

    <!-- Server Blade 2 (Middle) -->
    <rect x="28" y="44" width="44" height="10" rx="2" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="34" cy="49" r="1.5" fill="#10b581" />
    <circle cx="40" cy="49" r="1.5" fill="#10b581" />
    <line x1="48" y1="49" x2="64" y2="49" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />

    <!-- Server Blade 3 (Bottom) -->
    <rect x="28" y="60" width="44" height="10" rx="2" fill="#0f172a" stroke="#2563eb" stroke-width="1.5" />
    <circle cx="34" cy="65" r="1.5" fill="#10b581" />
    <circle cx="40" cy="65" r="1.5" fill="#f59e0b" />
    <line x1="48" y1="65" x2="64" y2="65" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />

    <!-- Stylized Speed Lightning 'W' Overlay -->
    <path d="M 26 40 L 36 78 L 50 50 L 64 78 L 74 40" 
          fill="none" 
          stroke="url(#wcpGlow)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neonGlow)" />
  </g>

  <!-- LOGO TEXT BRANDING -->
  <g transform="translate(125, 30)">
    <!-- "WebCare" Text -->
    <text x="0" y="42" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="42" 
          letter-spacing="-1" 
          fill="#ffffff">
      WebCare
    </text>

    <!-- "Pro" Badge / Text -->
    <g transform="translate(182, 6)">
      <rect x="0" y="8" width="80" height="40" rx="8" fill="url(#wcpGlow)" />
      <text x="40" y="36" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-weight="800" 
            font-size="24" 
            fill="#030712" 
            text-anchor="middle">
        PRO
      </text>
    </g>

    <!-- "AI Audit" Badge -->
    <g transform="translate(272, 10)">
      <rect x="0" y="8" width="105" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
      <text x="52.5" y="31" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-weight="800" 
            font-size="16" 
            fill="#a5b4fc" 
            text-anchor="middle">
        AI AUDIT
      </text>
    </g>

    <!-- Tagline Subtext -->
    <text x="2" y="66" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="600" 
          font-size="12" 
          letter-spacing="2" 
          fill="#94a3b8">
      SPEED &#8226; SECURITY &#8226; UPTIME
    </text>
  </g>
</svg>
