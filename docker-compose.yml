services:
  wcp-ai-audit:
    image: miralamin/wcp-ai-audit:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wcp-ai-audit-ubuntu
    restart: unless-stopped
    ports:
      # Nginx listens on port 80 and reverse proxies to internal Next.js
      - "80:80"
      - "3000:80"
    environment:
      - NODE_ENV=production
      - SCAN_RETENTION_DAYS=365
      # Optional: set subpath if behind a secondary reverse proxy (e.g. /ai-audit), or leave empty for root
      - NEXT_PUBLIC_BASE_PATH=
      # Optional: Google PageSpeed API Key
      - PAGESPEED_API_KEY=
    volumes:
      # Persistent local database & scans
      - ./data:/app/data
      # Persistent generated PDF storage
      - ./public/assets/scan:/app/public/assets/scan
